[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["*/migrations/*", "var/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", "var"]
skips = ["B101"]
