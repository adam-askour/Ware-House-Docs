events {}
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    upstream dms_web { server web:8000; }

    server {
        listen 443 ssl;
        server_name dms.internal;
        ssl_certificate /etc/nginx/certs/dms.crt;
        ssl_certificate_key /etc/nginx/certs/dms.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location /static/ {
            alias /srv/static/;
            access_log off;
            expires 1h;
        }
        location /media/ { return 404; }
        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://dms_web;
        }
    }
}
